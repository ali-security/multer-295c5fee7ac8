name: seal-build

on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # the public tarball was packed with Node 20.16.0 / npm 10.8.1
          node-version: "20.16.0"
      - name: Pack
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: multer-tgz
          path: ./multer-*.tgz
          if-no-files-found: error
